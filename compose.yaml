services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: seatflow
      MYSQL_USER: seatflow
      MYSQL_PASSWORD: ${SEATFLOW_MYSQL_PASSWORD:?Copy .env.example to .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set local MySQL root password}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -D seatflow -Nse "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4.11-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME:?Set local RabbitMQ user}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD:?Set local RabbitMQ password}
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    ports:
      - "${SEATFLOW_HTTP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SEATFLOW_MYSQL_URL: jdbc:mysql://mysql:3306/seatflow?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      SEATFLOW_MYSQL_USER: seatflow
      SEATFLOW_MYSQL_PASSWORD: ${SEATFLOW_MYSQL_PASSWORD:?Set local MySQL password}
      SEATFLOW_REDIS_HOST: redis
      SEATFLOW_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:?Set local RabbitMQ user}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:?Set local RabbitMQ password}
      SEATFLOW_AUTH_SIGNING_KEY: ${SEATFLOW_AUTH_SIGNING_KEY:-}
      SEATFLOW_MESSAGING_PUBLISHER_ENABLED: "true"
      SEATFLOW_MESSAGING_LISTENER_ENABLED: "true"
      SEATFLOW_MESSAGING_EXPIRY_ENABLED: "true"
      SEATFLOW_PAYMENT_REFUND_WORKER_ENABLED: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/api/v1/shows]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
volumes:
  mysql-data:
