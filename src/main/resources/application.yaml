spring:
  application:
    name: seatflow
  datasource:
    url: ${SEATFLOW_MYSQL_URL:jdbc:mysql://localhost:3306/seatflow?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${SEATFLOW_MYSQL_USER:seatflow}
    password: ${SEATFLOW_MYSQL_PASSWORD:}
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
  jackson:
    time-zone: UTC
  data:
    redis:
      host: ${SEATFLOW_REDIS_HOST:localhost}
      port: ${SEATFLOW_REDIS_PORT:6379}
      connect-timeout: 200ms
      timeout: 200ms
server:
  error:
    include-message: never
    include-stacktrace: never
seatflow:
  auth:
    signing-key: ${SEATFLOW_AUTH_SIGNING_KEY:}
    token-lifetime: PT1H
