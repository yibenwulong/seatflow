spring:
  application:
    name: seatflow
  datasource:
    url: ${SEATFLOW_MYSQL_URL:jdbc:mysql://localhost:3306/seatflow?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${SEATFLOW_MYSQL_USER:seatflow}
    password: ${SEATFLOW_MYSQL_PASSWORD:}
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 2s
    listener:
      simple:
        default-requeue-rejected: false
        prefetch: 10
  jackson:
    time-zone: UTC
  data:
    redis:
      host: ${SEATFLOW_REDIS_HOST:localhost}
      port: ${SEATFLOW_REDIS_PORT:6379}
      connect-timeout: 200ms
      timeout: 200ms
server:
  error:
    include-message: never
    include-stacktrace: never
seatflow:
  messaging:
    publisher-enabled: true
    listener-enabled: true
    expiry-enabled: true
  auth:
    signing-key: ${SEATFLOW_AUTH_SIGNING_KEY:}
    token-lifetime: PT1H
